<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <rect width="400" height="260" fill="#dff0ee"/>
  <rect x="0" y="200" width="400" height="60" fill="#b8d8d4"/>
  <!-- Sky gradient suggestion -->
  <rect x="0" y="0" width="400" height="200" fill="#dff0ee"/>
  <!-- Mountains/hills background -->
  <ellipse cx="320" cy="210" rx="120" ry="60" fill="#b0cfc9"/>
  <ellipse cx="80" cy="220" rx="100" ry="50" fill="#b8d8d4"/>
  <!-- Temple base -->
  <rect x="130" y="160" width="140" height="80" fill="#1e3560"/>
  <!-- Temple steps -->
  <rect x="120" y="220" width="160" height="15" fill="#162848"/>
  <rect x="110" y="235" width="180" height="12" fill="#0f1e38"/>
  <!-- Temple roof layers -->
  <polygon points="100,160 200,80 300,160" fill="#c4942a"/>
  <polygon points="115,160 200,95 285,160" fill="#1e3560"/>
  <polygon points="120,145 200,95 280,145" fill="#c4942a" opacity="0.8"/>
  <!-- Top spire -->
  <rect x="195" y="50" width="10" height="45" fill="#c4942a"/>
  <polygon points="185,55 200,30 215,55" fill="#c4942a"/>
  <!-- Windows -->
  <rect x="160" y="175" width="25" height="35" rx="2" fill="#c4942a" opacity="0.3"/>
  <rect x="215" y="175" width="25" height="35" rx="2" fill="#c4942a" opacity="0.3"/>
  <!-- Door -->
  <rect x="183" y="195" width="34" height="45" rx="2" fill="#0a1628"/>
  <!-- Dharma wheel above door -->
  <circle cx="200" cy="185" r="8" fill="none" stroke="#c4942a" stroke-width="2"/>
  <text x="200" y="189" font-family="serif" font-size="10" text-anchor="middle" fill="#c4942a">☸</text>
</svg>
